[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "filevine-mcp"
version = "0.2.0"
description = "MCP server for Filevine API — full coverage for legal case management"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["filevine", "mcp", "legal", "law", "claude", "case-management"]
dependencies = [
    "mcp==2.0.0",
    "requests>=2.34.2",
    "keyring>=25.7.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4,<10",
]

[project.scripts]
filevine-mcp = "filevine_mcp.server:main"
filevine-mcp-setup = "filevine_mcp.setup.oauth_flow:main"
filevine-mcp-verify = "filevine_mcp.setup.verify:main"

[project.urls]
Homepage = "https://github.com/RosenAdvertising/filevine-mcp"
Issues = "https://github.com/RosenAdvertising/filevine-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["filevine_mcp"]

[tool.pyright]
include = ["."]
exclude = ["**/node_modules", "**/__pycache__", ".venv", "venv", "dist", "build"]
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingTypeStubs = false

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
