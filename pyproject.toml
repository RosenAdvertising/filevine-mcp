[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "filevine-mcp"
version = "0.3.0"
description = "MCP server for Filevine: projects, contacts, documents, tasks and billing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["filevine", "mcp", "legal", "law", "claude", "case-management"]
classifiers = [
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
]
dependencies = [
    "mcp>=2.3,<3",
    "requests>=2.34.2",
    "keyring>=25.7.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4,<10",
]

[project.scripts]
filevine-mcp = "filevine_mcp.server:main"
filevine-mcp-setup = "filevine_mcp.cli:setup_main"
filevine-mcp-verify = "filevine_mcp.cli:verify_main"

[project.urls]
Homepage = "https://github.com/RosenAdvertising/filevine-mcp"
Repository = "https://github.com/RosenAdvertising/filevine-mcp"
Issues = "https://github.com/RosenAdvertising/filevine-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["filevine_mcp"]

[tool.pyright]
include = ["."]
exclude = ["**/node_modules", "**/__pycache__", ".venv", "venv", "dist", "build"]
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingTypeStubs = false

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
